<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidadela — Q&A do Apresentador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --brand-primary: #38bdf8;
            --brand-secondary: #a78bfa;
            --brand-accent: #f472b6;
            --bg-dark: #030712;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
        }

        * { box-sizing: border-box; }

        html, body { margin: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(56, 189, 248, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 10% 10%, rgba(56, 189, 248, 0.12), transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(167, 139, 250, 0.10), transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        .gradient-text {
            background: linear-gradient(135deg, #fff 10%, #38bdf8 50%, #a78bfa 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gradient-text-warm {
            background: linear-gradient(135deg, #fbbf24 0%, #f472b6 60%, #a78bfa 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(56, 189, 248, 0.08);
            color: var(--brand-primary);
            padding: 0.35rem 0.9rem;
            border-radius: 99px;
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .layout {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            position: sticky;
            top: 0;
            align-self: start;
            height: 100vh;
            overflow-y: auto;
            border-right: 1px solid rgba(255,255,255,0.06);
            padding: 1.5rem 1rem;
            background: rgba(3, 7, 18, 0.7);
            backdrop-filter: blur(10px);
        }

        .sidebar h2 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(255,255,255,0.45);
            margin: 1rem 0 0.5rem;
            padding: 0 0.75rem;
        }

        .persona-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.7rem 0.9rem;
            border-radius: 0.6rem;
            background: transparent;
            border: 1px solid transparent;
            color: #cbd5e1;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 0.25rem;
        }

        .persona-btn:hover {
            background: rgba(56, 189, 248, 0.06);
            color: #fff;
        }

        .persona-btn.active {
            background: linear-gradient(135deg, rgba(56,189,248,0.12), rgba(167,139,250,0.08));
            border-color: rgba(56,189,248,0.3);
            color: #fff;
        }

        .persona-btn .ico {
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.4rem;
            background: rgba(255,255,255,0.05);
            font-size: 0.85rem;
        }

        .persona-btn .count {
            margin-left: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
        }

        .content {
            padding: 2.5rem 3rem 6rem;
            max-width: 1100px;
        }

        .search-wrap {
            position: sticky;
            top: 0;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(3,7,18,0.95) 80%, transparent);
            padding: 1rem 0 1.5rem;
            margin-bottom: 1rem;
        }

        .search-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 0.7rem;
            padding: 0.9rem 1.1rem 0.9rem 2.8rem;
            color: #fff;
            font-size: 0.95rem;
            backdrop-filter: blur(10px);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(56,189,248,0.15);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.4);
        }

        .qa-card {
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 1rem;
            margin-bottom: 1.2rem;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .qa-card:hover { border-color: rgba(56,189,248,0.25); }

        .qa-card.open { border-color: rgba(56,189,248,0.4); }

        .qa-question {
            cursor: pointer;
            padding: 1.2rem 1.4rem;
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            user-select: none;
        }

        .qa-q-meta {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            flex: 1;
        }

        .qa-q-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: #f8fafc;
            line-height: 1.35;
        }

        .qa-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .mini-tag {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.2rem 0.6rem;
            border-radius: 99px;
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.55);
            border: 1px solid rgba(255,255,255,0.07);
        }

        .mini-tag.risk { color: #fca5a5; border-color: rgba(239,68,68,0.25); background: rgba(239,68,68,0.05); }
        .mini-tag.tech { color: #93c5fd; border-color: rgba(56,189,248,0.25); background: rgba(56,189,248,0.05); }
        .mini-tag.exec { color: #fcd34d; border-color: rgba(245,158,11,0.25); background: rgba(245,158,11,0.05); }
        .mini-tag.gov  { color: #f9a8d4; border-color: rgba(244,114,182,0.25); background: rgba(244,114,182,0.05); }

        .chevron {
            color: rgba(255,255,255,0.4);
            transition: transform 0.25s;
            margin-top: 0.3rem;
        }

        .qa-card.open .chevron { transform: rotate(180deg); color: var(--brand-primary); }

        .qa-body {
            display: none;
            padding: 0 1.4rem 1.4rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            margin-top: -0.2rem;
        }

        .qa-card.open .qa-body { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .answer-block {
            margin-top: 1.2rem;
        }

        .answer-label {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--brand-primary);
            margin-bottom: 0.5rem;
        }

        .answer-label.short  { color: #6ee7b7; }
        .answer-label.deep   { color: #93c5fd; }
        .answer-label.anchor { color: #f9a8d4; }
        .answer-label.trap   { color: #fca5a5; }

        .answer-short {
            font-size: 1.05rem;
            font-weight: 600;
            color: #e2e8f0;
            line-height: 1.55;
            padding: 0.9rem 1rem;
            background: linear-gradient(135deg, rgba(16,185,129,0.08), rgba(56,189,248,0.04));
            border-left: 3px solid var(--accent-green);
            border-radius: 0.5rem;
        }

        .answer-deep {
            color: #cbd5e1;
            line-height: 1.65;
            font-size: 0.95rem;
        }

        .answer-deep p { margin: 0 0 0.7rem; }
        .answer-deep ul { margin: 0.4rem 0 0.8rem 1.2rem; padding: 0; }
        .answer-deep li { margin-bottom: 0.4rem; }
        .answer-deep b, .answer-deep strong { color: #fff; }
        .answer-deep code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            background: rgba(56,189,248,0.08);
            color: #93c5fd;
            padding: 0.1rem 0.4rem;
            border-radius: 0.3rem;
        }

        .anchor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.6rem;
            margin-top: 0.6rem;
        }

        .anchor-chip {
            background: rgba(244,114,182,0.05);
            border: 1px solid rgba(244,114,182,0.15);
            border-radius: 0.5rem;
            padding: 0.6rem 0.8rem;
            font-size: 0.82rem;
            color: #f5d0e2;
        }

        .anchor-chip b { color: #fff; display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.2rem; color: var(--brand-accent); }

        .trap-box {
            background: rgba(239,68,68,0.06);
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: 0.5rem;
            padding: 0.8rem 1rem;
            font-size: 0.88rem;
            color: #fecaca;
            line-height: 1.55;
        }

        .persona-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }

        .persona-header .pic {
            width: 56px;
            height: 56px;
            border-radius: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            background: linear-gradient(135deg, rgba(56,189,248,0.15), rgba(167,139,250,0.1));
            border: 1px solid rgba(56,189,248,0.25);
        }

        .persona-title {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        .persona-sub {
            color: rgba(255,255,255,0.5);
            font-size: 1rem;
            margin-top: 0.3rem;
        }

        .persona-mindset {
            margin: 1.2rem 0 2rem;
            padding: 1rem 1.2rem;
            background: rgba(15,23,42,0.5);
            border-left: 3px solid var(--brand-secondary);
            border-radius: 0.5rem;
            color: #cbd5e1;
            font-size: 0.92rem;
            line-height: 1.6;
        }

        .persona-mindset b { color: #fff; }

        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
            color: rgba(255,255,255,0.4);
        }

        .nav-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 1.5rem;
        }

        .nav-top a {
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: color 0.15s;
        }

        .nav-top a:hover { color: var(--brand-primary); }

        .toolbar {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.8rem;
            flex-wrap: wrap;
        }

        .filter-pill {
            cursor: pointer;
            padding: 0.4rem 0.85rem;
            border-radius: 99px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.65);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .filter-pill.active {
            background: var(--brand-primary);
            color: #020617;
            border-color: var(--brand-primary);
        }

        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; }
            .sidebar {
                position: relative;
                height: auto;
                border-right: none;
                border-bottom: 1px solid rgba(255,255,255,0.06);
            }
            .content { padding: 1.5rem 1.2rem 4rem; }
        }
    </style>
</head>
<body>
    <div class="layout">
        <!-- ============================================================ -->
        <!-- SIDEBAR — Personas / Atores decisores                          -->
        <!-- ============================================================ -->
        <aside class="sidebar">
            <div style="padding: 0 0.75rem 1rem;">
                <div class="tag" style="margin-bottom: 0.6rem;"><i class="fas fa-microphone"></i> Q&A do apresentador</div>
                <div style="font-size: 1.1rem; font-weight: 800; line-height: 1.2;">Cidadela</div>
                <div style="font-size: 0.78rem; color: rgba(255,255,255,0.45); margin-top: 0.2rem;">Prepare-se para a sala de decisão.</div>
            </div>

            <h2>Atores decisores</h2>
            <div id="personaList"></div>

            <h2 style="margin-top: 1.5rem;">Atalhos</h2>
            <div style="padding: 0 0.75rem;">
                <a href="conceito.html" style="display: block; color: #cbd5e1; font-size: 0.85rem; padding: 0.4rem 0; text-decoration: none;">
                    <i class="fas fa-arrow-left" style="margin-right: 0.4rem; color: var(--brand-primary);"></i>
                    Voltar ao Conceito
                </a>
                <a href="/" style="display: block; color: #cbd5e1; font-size: 0.85rem; padding: 0.4rem 0; text-decoration: none;">
                    <i class="fas fa-rocket" style="margin-right: 0.4rem; color: var(--brand-accent);"></i>
                    Abrir o produto
                </a>
            </div>
        </aside>

        <!-- ============================================================ -->
        <!-- CONTENT                                                        -->
        <!-- ============================================================ -->
        <section class="content">
            <div class="nav-top">
                <div style="font-size: 0.8rem; color: rgba(255,255,255,0.5);">
                    <i class="fas fa-shield-halved" style="color: var(--brand-primary); margin-right: 0.4rem;"></i>
                    Material de apoio · uso interno do apresentador
                </div>
                <div style="font-size: 0.75rem; color: rgba(255,255,255,0.4); font-family: 'JetBrains Mono', monospace;">
                    <span id="qaCount">0</span> perguntas catalogadas
                </div>
            </div>

            <div id="personaHeader"></div>

            <div class="search-wrap" style="position: relative;">
                <i class="fas fa-search search-icon"></i>
                <input id="searchInput" class="search-input" type="text" placeholder="Buscar por palavra-chave, tema ou objeção (ex: LGPD, GPU, payback, alucinação)...">
                <div class="toolbar">
                    <button class="filter-pill active" data-filter="all">Todas</button>
                    <button class="filter-pill" data-filter="risk">Risco</button>
                    <button class="filter-pill" data-filter="tech">Técnica</button>
                    <button class="filter-pill" data-filter="exec">Executiva</button>
                    <button class="filter-pill" data-filter="gov">Governança</button>
                </div>
            </div>

            <div id="qaContainer"></div>
        </section>
    </div>

    <script>
        // ===========================================================
        // DATA — Personas + Q&A
        // ===========================================================
        const PERSONAS = [
            {
                id: 'ceo',
                name: 'CEO / Patrocinador Executivo',
                icon: 'fa-chess-king',
                sub: 'Quer entender por que isso, por que agora, e o que muda na história da companhia.',
                mindset: '<b>Mentalidade:</b> não quer detalhe técnico. Quer convicção, ambição, ancoragem em mercado e diferenciação competitiva. Mede em 60 segundos se vale apostar o nome dele.'
            },
            {
                id: 'cfo',
                name: 'CFO / Financeiro',
                icon: 'fa-coins',
                sub: 'Quer ver custo, retorno, comparativo com SaaS e horizonte de payback.',
                mindset: '<b>Mentalidade:</b> a pergunta-mãe é "quanto custa e quando paga?". Vai testar pressupostos. Não responda com "vai depender" — responda com faixa, premissa explícita e fonte.'
            },
            {
                id: 'cio',
                name: 'CIO / Diretor de TI',
                icon: 'fa-server',
                sub: 'Quer entender arquitetura, integração com legado, escala e dependência de fornecedor.',
                mindset: '<b>Mentalidade:</b> já foi queimado antes. Vai sondar vendor lock-in, custo de operação, plano de DR e como isso vai conviver com SAP, Cervello, AD, M365.'
            },
            {
                id: 'ciso',
                name: 'CISO / Segurança da Informação',
                icon: 'fa-shield-halved',
                sub: 'Quer evidência de que nenhum dado sensível sai do perímetro e que tudo é auditável.',
                mindset: '<b>Mentalidade:</b> presume risco até provarem o contrário. Vai testar superfície de ataque, exfiltração via prompt, isolamento por setor, criptografia e trilha.'
            },
            {
                id: 'dpo',
                name: 'DPO / Jurídico / Compliance',
                icon: 'fa-balance-scale',
                sub: 'Quer enquadramento LGPD, base legal, retenção, direito do titular e risco regulatório setorial.',
                mindset: '<b>Mentalidade:</b> não quer surpresa em auditoria da ANPD nem em fiscalização Anvisa. Foca em quem é controlador, operador, e onde o dado pessoal pode aparecer no fluxo.'
            },
            {
                id: 'arquiteto',
                name: 'Arquiteto / Tech Lead',
                icon: 'fa-diagram-project',
                sub: 'Quer testar a decisão técnica: RAG vs fine-tuning, modelo local vs API, escolha de stack.',
                mindset: '<b>Mentalidade:</b> vai pegar no detalhe. Quer saber por que Qdrant e não pgvector, por que Ollama e não vLLM, por que knowledge graph, como lida com drift e atualização do corpus.'
            },
            {
                id: 'operacoes',
                name: 'Diretor de Operações / Negócio',
                icon: 'fa-people-line',
                sub: 'Quer saber se as pessoas vão usar, se vai conflitar com processo existente, e como medir adoção.',
                mindset: '<b>Mentalidade:</b> já viu sistema bonito morrer por falta de uso. Quer change management, dono claro do processo, treinamento e métrica de adoção real, não de login.'
            },
            {
                id: 'inovacao',
                name: 'Diretor de Inovação / Estratégia',
                icon: 'fa-lightbulb',
                sub: 'Quer entender por que construir e não comprar Copilot, ChatGPT Enterprise ou Gemini.',
                mindset: '<b>Mentalidade:</b> está atrás de tese diferenciada. Vai perguntar moat, defensabilidade, e se isso é commodity em 18 meses.'
            },
            {
                id: 'auditoria',
                name: 'Auditoria Interna / Controles',
                icon: 'fa-file-shield',
                sub: 'Quer evidência de segregação, trilha imutável, controles compensatórios e revisão periódica.',
                mindset: '<b>Mentalidade:</b> pensa em SOX, ISO 27001, e em como provar isso em uma auditoria externa. Quer ver log, política, papéis, evidência de revisão.'
            },
            {
                id: 'rh',
                name: 'RH / Pessoas & Cultura',
                icon: 'fa-users',
                sub: 'Quer saber se isso substitui pessoas, requalifica, ou cria ansiedade no time.',
                mindset: '<b>Mentalidade:</b> vai pesar narrativa interna. Mede em mensagem para o colaborador: vai sumir vaga, ou vai sobrar tempo para trabalho qualificado?'
            }
        ];

        const QA = [
            // ============================================================
            // CEO
            // ============================================================
            {
                persona: 'ceo',
                tags: ['exec'],
                q: 'Por que agora? Por que não esperar a tecnologia amadurecer mais 12 meses?',
                short: 'Porque a janela de virada para a era dos agentes está abrindo agora — e quem chega depois compra o pacote do concorrente como serviço, com a estrutura cognitiva da nossa empresa lá dentro.',
                deep: '<p>Os modelos generalistas já estão prontos. O que ainda não está pronto, em quase nenhuma empresa, é a <b>camada de contexto curado, agentes setoriais e governança auditável</b>. Essa camada não vem com a tecnologia — ela é construída em cima da operação de cada companhia.</p><p>Esperar 12 meses não acelera. Atrasa. Porque os concorrentes que começarem agora vão sair do piloto em paralelo com a próxima geração de modelos, já com SOPs curados, trilha auditável e times treinados. Quem começa em 2027 começa do zero — com o mesmo modelo, mas sem a camada que faz o modelo virar agente.</p>',
                anchors: [
                    { label: 'Dado de mercado', text: '87% dos projetos de IA corporativa não saem do piloto (Gartner/IDC/MIT Sloan, 2024).' },
                    { label: 'Diferencial', text: 'O moat não é o modelo — é o corpus curado e a governança em cima dele.' }
                ],
                trap: 'Se perguntarem "e se sair um modelo melhor?", responda: <b>"Trocamos o motor sem trocar o veículo."</b> A arquitetura desacopla modelo de corpus, justamente para sobreviver à próxima geração.'
            },
            {
                persona: 'ceo',
                tags: ['exec', 'risk'],
                q: 'O que acontece se a gente não fizer nada?',
                short: 'Continuamos pagando o custo invisível de buscar SOP, abrir chamado sem contexto e usar ChatGPT público à revelia — enquanto o concorrente vira referência setorial.',

        // ===========================================================

        const personaList = document.getElementById('personaList');
        const qaContainer = document.getElementById('qaContainer');
        const personaHeader = document.getElementById('personaHeader');
        const searchInput = document.getElementById('searchInput');
        const qaCount = document.getElementById('qaCount');
        const filterPills = document.querySelectorAll('.filter-pill');

        let currentPersona = 'all';
        let currentFilter = 'all';
        let currentQuery = '';

        qaCount.innerText = QA.length;

        function renderPersonas() {
            const counts = {};
            QA.forEach(item => { counts[item.persona] = (counts[item.persona] || 0) + 1; });

            const allBtn = `
                <button class="persona-btn ${currentPersona === 'all' ? 'active' : ''}" data-persona="all">
                    <span class="ico"><i class="fas fa-layer-group"></i></span>
                    <span>Todas as personas</span>
                    <span class="count">${QA.length}</span>
                </button>
            `;
            personaList.innerHTML = allBtn + PERSONAS.map(p => `
                <button class="persona-btn ${currentPersona === p.id ? 'active' : ''}" data-persona="${p.id}">
                    <span class="ico"><i class="fas ${p.icon}"></i></span>
                    <span>${p.name.split(' / ')[0]}</span>
                    <span class="count">${counts[p.id] || 0}</span>
                </button>
            `).join('');

            personaList.querySelectorAll('.persona-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentPersona = btn.dataset.persona;
                    renderPersonas();
                    renderHeader();
                    renderQA();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            });
        }

        function renderHeader() {
            if (currentPersona === 'all') {
                personaHeader.innerHTML = `
                    <div class="persona-header">
                        <div class="pic"><i class="fas fa-layer-group"></i></div>
                        <div>
                            <div class="persona-title gradient-text">Todas as perguntas</div>
                            <div class="persona-sub">Visão consolidada para preparação geral antes da apresentação.</div>
                        </div>
                    </div>
                    <div class="persona-mindset">
                        <b>Como usar:</b> filtre por persona na barra lateral para ensaiar uma sala específica, ou use a busca para localizar uma objeção exata (ex: "GPU", "LGPD", "Copilot", "payback"). Cada cartão traz uma <b>resposta curta para falar em voz alta</b> e uma <b>resposta profunda</b> para sustentar a réplica.
                    </div>
                `;
                return;
            }
            const p = PERSONAS.find(x => x.id === currentPersona);
            personaHeader.innerHTML = `
                <div class="persona-header">
                    <div class="pic"><i class="fas ${p.icon}"></i></div>
                    <div>
                        <div class="persona-title gradient-text">${p.name}</div>
                        <div class="persona-sub">${p.sub}</div>
                    </div>
                </div>
                <div class="persona-mindset">${p.mindset}</div>
            `;
        }

        function tagLabel(t) {
            return ({ risk: 'Risco', tech: 'Técnica', exec: 'Executiva', gov: 'Governança' })[t] || t;
        }

        function matchesFilter(item) {
            if (currentPersona !== 'all' && item.persona !== currentPersona) return false;
            if (currentFilter !== 'all' && !(item.tags || []).includes(currentFilter)) return false;
            if (currentQuery) {
                const haystack = (item.q + ' ' + item.short + ' ' + item.deep + ' ' + (item.anchors || []).map(a => a.label + ' ' + a.text).join(' ')).toLowerCase();
                if (!haystack.includes(currentQuery.toLowerCase())) return false;
            }
            return true;
        }

        function renderQA() {
            const filtered = QA.filter(matchesFilter);
            if (filtered.length === 0) {
                qaContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search" style="font-size: 2rem; opacity: 0.3; margin-bottom: 1rem;"></i>
                        <div>Nenhuma pergunta combina com este filtro.</div>
                    </div>
                `;
                return;
            }

            qaContainer.innerHTML = filtered.map((item, idx) => {
                const persona = PERSONAS.find(p => p.id === item.persona);
                const tagsHtml = (item.tags || []).map(t => `<span class="mini-tag ${t}">${tagLabel(t)}</span>`).join('');
                const personaTag = currentPersona === 'all' && persona ? `<span class="mini-tag"><i class="fas ${persona.icon}" style="margin-right: 0.3rem;"></i>${persona.name.split(' / ')[0]}</span>` : '';

                const anchorsHtml = (item.anchors || []).length > 0 ? `
                    <div class="answer-block">
                        <div class="answer-label anchor"><i class="fas fa-anchor"></i> Âncoras de reforço</div>
                        <div class="anchor-grid">
                            ${item.anchors.map(a => `<div class="anchor-chip"><b>${a.label}</b>${a.text}</div>`).join('')}
                        </div>
                    </div>
                ` : '';

                const trapHtml = item.trap ? `
                    <div class="answer-block">
                        <div class="answer-label trap"><i class="fas fa-triangle-exclamation"></i> Cuidado / Repergunta esperada</div>
                        <div class="trap-box">${item.trap}</div>
                    </div>
                ` : '';

                return `
                    <div class="qa-card" data-idx="${idx}">
                        <div class="qa-question">
                            <div class="qa-q-meta">
                                <div class="qa-q-text">${item.q}</div>
                                <div class="qa-tags">${personaTag}${tagsHtml}</div>
                            </div>
                            <i class="fas fa-chevron-down chevron"></i>
                        </div>
                        <div class="qa-body">
                            <div class="answer-block">
                                <div class="answer-label short"><i class="fas fa-bolt"></i> Resposta curta — fale em voz alta</div>
                                <div class="answer-short">${item.short}</div>
                            </div>
                            <div class="answer-block">
                                <div class="answer-label deep"><i class="fas fa-layer-group"></i> Resposta profunda — sustente a réplica</div>
                                <div class="answer-deep">${item.deep}</div>
                            </div>
                            ${anchorsHtml}
                            ${trapHtml}
                        </div>
                    </div>
                `;
            }).join('');

            qaContainer.querySelectorAll('.qa-card').forEach(card => {
                const q = card.querySelector('.qa-question');
                q.addEventListener('click', () => card.classList.toggle('open'));
            });
        }

        searchInput.addEventListener('input', (e) => {
            currentQuery = e.target.value.trim();
            renderQA();
        });

        filterPills.forEach(pill => {
            pill.addEventListener('click', () => {
                filterPills.forEach(p => p.classList.remove('active'));
                pill.classList.add('active');
                currentFilter = pill.dataset.filter;
                renderQA();
            });
        });

        renderPersonas();
        renderHeader();
        renderQA();
    </script>
</body>
</html>
